name: calculadora_de_custos_imoveis
description: Aplicativo móvel para consulta e regularização de gastos de imóveis.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.0.0
  
  # State Management
  provider: ^6.0.0
  
  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # Data Serialization
  json_annotation: ^4.8.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.0.0
  
  # PDF Export
  pdf: ^3.10.0
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  json_serializable: ^6.7.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

  # Assets
  assets:
    - assets/images/
    - assets/icons/